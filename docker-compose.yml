services:
  db:
    build:
      context: ./backend/scripts

    container_name: monebank-db

    restart: always

    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monebank"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend

    container_name: monebank-backend

    restart: always

    env_file:
      - ./backend/.env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend

    container_name: monebank-frontend

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
