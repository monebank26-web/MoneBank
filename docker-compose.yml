services:
  db:
    image: postgres:17
    container_name: monebank-db

    restart: always

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: monebank-backend

    restart: always

    env_file:
      - ./backend/.env

    depends_on:
      - db

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend

    container_name: monebank-frontend

    depends_on:
      - backend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
